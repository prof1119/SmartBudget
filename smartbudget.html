<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBudget — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --gold: #c8a96e;
        --gold-dim: rgba(200, 169, 110, 0.3);
        --gold-faint: rgba(200, 169, 110, 0.08);
        --bg: #0a0a0f;
        --text: #e8e4dc;
        --text-dim: rgba(232, 228, 220, 0.5);
        --text-mute: rgba(232, 228, 220, 0.3);
        --serif: "Playfair Display", Georgia, serif;
        --mono: "DM Mono", "Courier New", monospace;
        --green: #7fb07f;
        --red: #d07070;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        min-height: 100vh;
      }

      /* ─── Grid background ─── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(200, 169, 110, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200, 169, 110, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        z-index: 0;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        position: relative;
        z-index: 1;
      }

      /* ─── NAV ─── */
      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 1.25rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--gold-faint);
        background: rgba(10, 10, 15, 0.9);
        backdrop-filter: blur(20px);
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .nav-icon {
        color: var(--gold);
        font-size: 1.3rem;
      }
      .nav-name {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: #a89070;
      }

      .refresh-btn {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid var(--gold-dim);
        background: transparent;
        padding: 6px 16px;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .refresh-btn:hover {
        background: var(--gold);
        color: var(--bg);
      }
      .refresh-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ─── LOADING OVERLAY ─── */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-ring {
        width: 40px;
        height: 40px;
        border: 2px solid var(--gold-faint);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── ERROR BANNER ─── */
      #error-banner {
        display: none;
        background: rgba(208, 112, 112, 0.1);
        border: 1px solid rgba(208, 112, 112, 0.3);
        color: var(--red);
        font-family: var(--mono);
        font-size: 0.75rem;
        padding: 0.75rem 1.5rem;
        text-align: center;
      }

      /* ─── PAGE HEADER ─── */
      .page-header {
        padding: 3rem 0 2rem;
      }
      .page-title {
        font-family: var(--serif);
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        line-height: 1;
        color: #f0ebe0;
      }
      .page-title span {
        font-style: italic;
        color: var(--gold);
      }
      .page-sub {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--text-mute);
        margin-top: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ─── TAG ─── */
      .tag {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid var(--gold-dim);
        padding: 3px 9px;
        display: inline-block;
        margin-bottom: 1.5rem;
      }
      .section-line {
        display: inline-block;
        width: 30px;
        height: 1px;
        background: var(--gold);
        vertical-align: middle;
        margin-right: 10px;
      }

      /* ─── STAT CARDS ─── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1px;
        background: rgba(200, 169, 110, 0.08);
        margin-bottom: 3rem;
      }
      .stat-card {
        background: var(--bg);
        padding: 1.75rem 1.5rem;
        position: relative;
        overflow: hidden;
        transition: transform 0.3s;
      }
      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .stat-card:hover {
        transform: translateY(-3px);
      }
      .stat-card:hover::before {
        opacity: 1;
      }

      .stat-label {
        font-family: var(--mono);
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(200, 169, 110, 0.5);
        margin-bottom: 0.5rem;
      }
      .stat-value {
        font-family: var(--serif);
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--gold);
        line-height: 1;
        transition: color 0.3s;
      }
      .stat-badge {
        display: inline-block;
        font-family: var(--mono);
        font-size: 0.65rem;
        margin-top: 0.4rem;
        padding: 2px 8px;
        border-radius: 2px;
      }
      .stat-badge.up {
        color: var(--green);
        background: rgba(127, 176, 127, 0.1);
      }
      .stat-badge.down {
        color: var(--red);
        background: rgba(208, 112, 112, 0.1);
      }
      .stat-badge.neu {
        color: var(--gold);
        background: rgba(200, 169, 110, 0.1);
      }
      .stat-bar {
        height: 2px;
        background: rgba(200, 169, 110, 0.12);
        margin-top: 1rem;
        overflow: hidden;
      }
      .stat-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--gold), #e8c87a);
        width: 0;
        transition: width 1.2s ease;
      }

      /* ─── CHART SECTION ─── */
      .chart-section {
        margin-bottom: 3rem;
      }
      .chart-box {
        border: 1px solid rgba(200, 169, 110, 0.12);
        padding: 1.5rem;
        background: rgba(200, 169, 110, 0.015);
      }
      .chart-title {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--gold);
        letter-spacing: 0.08em;
        margin-bottom: 1.25rem;
        text-transform: uppercase;
      }
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 120px;
      }
      .bar-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .bar {
        width: 100%;
        background: rgba(200, 169, 110, 0.2);
        transition:
          height 0.8s ease,
          background 0.3s;
        cursor: pointer;
        position: relative;
      }
      .bar:hover {
        background: rgba(200, 169, 110, 0.55);
      }
      .bar.highlight {
        background: var(--gold);
      }
      .bar-tooltip {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-4px);
        background: #1a1a22;
        border: 1px solid var(--gold-dim);
        color: var(--gold);
        font-family: var(--mono);
        font-size: 0.6rem;
        padding: 3px 7px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .bar:hover .bar-tooltip {
        opacity: 1;
      }
      .bar-label {
        font-family: var(--mono);
        font-size: 0.55rem;
        color: rgba(200, 169, 110, 0.35);
        text-align: center;
      }

      /* ─── SAVING GOALS ─── */
      .goals-section {
        margin-bottom: 4rem;
      }
      .goals-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1px;
        background: rgba(200, 169, 110, 0.06);
      }
      .goal-card {
        background: var(--bg);
        padding: 1.5rem;
        transition: background 0.3s;
      }
      .goal-card:hover {
        background: rgba(200, 169, 110, 0.03);
      }
      .goal-name {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(200, 169, 110, 0.5);
        margin-bottom: 0.75rem;
      }
      .goal-amounts {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.6rem;
      }
      .goal-saved {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 700;
        color: #f0ebe0;
      }
      .goal-target {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--text-mute);
      }
      .goal-bar {
        height: 3px;
        background: rgba(200, 169, 110, 0.12);
        margin-bottom: 0.5rem;
        overflow: hidden;
      }
      .goal-fill {
        height: 100%;
        background: var(--gold);
        width: 0;
        transition: width 1.2s ease;
      }
      .goal-pct {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--gold);
      }

      /* ─── FOOTER ─── */
      footer {
        position: relative;
        z-index: 1;
        padding: 2rem;
        border-top: 1px solid var(--gold-faint);
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      .footer-api {
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--text-mute);
      }
      .footer-api span {
        color: var(--green);
      }

      /* ─── Skeleton shimmer ─── */
      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(200, 169, 110, 0.05) 25%,
          rgba(200, 169, 110, 0.12) 50%,
          rgba(200, 169, 110, 0.05) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 2px;
        color: transparent !important;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      @media (max-width: 600px) {
        .bar-chart {
          height: 80px;
          gap: 3px;
        }
        .stat-value {
          font-size: 1.8rem;
        }
      }
      .nav-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
      .currency-select{font-family:var(--mono);font-size:.7rem;color:var(--gold);background:var(--bg);border:1px solid var(--gold-dim);padding:6px 8px}
      .app-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.25rem;font-family:var(--mono);font-size:.75rem}
      .app-form label{display:flex;flex-direction:column;gap:.4rem;color:var(--text-dim)}
      .app-form input,.app-form select{width:100%;min-width:0;background:#111119;border:1px solid var(--gold-dim);padding:.7rem;color:var(--text);font:inherit}
      .app-form .wide{grid-column:1/-1}
      .feedback{font-family:var(--mono);font-size:.75rem;color:var(--green);min-height:1em}
      .feedback.error{color:var(--red)}
      .transactions-list{display:grid;gap:.5rem}
      .transaction-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:1rem;border-top:1px solid var(--gold-faint);padding:.8rem 0;font-family:var(--mono);font-size:.75rem}
      .transaction-meta{color:var(--text-mute);font-size:.65rem;margin-top:.25rem;overflow-wrap:anywhere}
      .amount-income{color:var(--green)} .amount-expense{color:var(--red)}
      .delete-btn{font:inherit;color:var(--red);background:transparent;border:1px solid rgba(208,112,112,.35);padding:.35rem .55rem;cursor:pointer}
      .goal-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
      .empty-state{padding:1rem;color:var(--text-dim);font-family:var(--mono);font-size:.75rem}
      @media(max-width:600px){nav{padding:1rem;align-items:flex-start;gap:.75rem}.nav-actions{max-width:70%}.transaction-row{grid-template-columns:minmax(0,1fr) auto}.transaction-row .delete-btn{grid-column:2}.container{padding:0 1rem}}
    </style>
  </head>
  <body>
    <!-- Loading overlay -->
    <div id="loader"><div class="loader-ring"></div></div>

    <!-- Error banner -->
    <div id="error-banner">
      ⚠ Could not connect to API — make sure
      <code>uvicorn main:app --reload</code> is running on port 8000.
    </div>

    <!-- NAV -->
    <nav>
      <div class="nav-brand">
        <span class="nav-icon">◈</span>
        <span class="nav-name">SmartBudget</span>
      </div>
      <div class="nav-actions">
        <select id="currencySelect" class="currency-select" aria-label="Display currency">
          <option value="EGP">EGP</option><option value="USD">USD</option>
        </select>
        <a class="refresh-btn" href="/api/transactions/export.csv">Export CSV</a>
        <a class="refresh-btn" href="/api/backup">Backup DB</a>
        <button class="refresh-btn" id="refreshBtn" type="button" onclick="loadDashboard()">↻ Refresh</button>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="container">
      <!-- Header -->
      <div class="page-header">
        <h1 class="page-title">Smart<span>Budget</span></h1>
        <p class="page-sub" id="lastUpdated">Loading data…</p>
      </div>

      <!-- ── Stats ── -->
      <div class="tag"><span class="section-line"></span>Overview</div>
      <div class="stats-grid" id="statsGrid">
        <!-- injected by JS -->
      </div>

      <!-- ── Transactions ── -->
      <section class="chart-section">
        <div class="tag"><span class="section-line"></span>Transactions</div>
        <div class="chart-box">
          <form id="transactionForm" class="app-form">
            <label>Type<select id="txKind" required><option value="expense">Expense</option><option value="income">Income</option></select></label>
            <label>Amount<input id="txAmount" type="number" min="0.01" step="0.01" required /></label>
            <label>Category<input id="txCategory" maxlength="60" required /></label>
            <label>Date<input id="txDate" type="date" required /></label>
            <label class="wide">Note (optional)<input id="txNote" maxlength="240" /></label>
            <button class="refresh-btn" type="submit">Save transaction</button>
            <p id="txFeedback" class="feedback wide" role="status"></p>
          </form>
          <div id="transactionsList" class="transactions-list"></div>
        </div>
      </section>

      <!-- ── Bar Chart ── -->
      <div class="chart-section">
        <div class="tag">
          <span class="section-line"></span>Monthly Expenses
        </div>
        <div class="chart-box">
          <div class="chart-title" id="chartTitle">Loading…</div>
          <div class="bar-chart" id="barChart"></div>
        </div>
      </div>

      <!-- ── Saving Goals ── -->
      <div class="goals-section">
        <div class="tag"><span class="section-line"></span>Saving Goals</div>
        <div class="goals-grid" id="goalsGrid"></div>
        <div class="chart-box" style="margin-top:1rem">
          <form id="goalForm" class="app-form">
            <label>Goal name<input id="goalName" maxlength="80" required /></label>
            <label>Target amount<input id="goalTarget" type="number" min="0.01" step="0.01" required /></label>
            <label>Already saved<input id="goalSaved" type="number" min="0" step="0.01" value="0" required /></label>
            <button class="refresh-btn" type="submit">Create saving goal</button>
            <p id="goalFeedback" class="feedback wide" role="status"></p>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-api">
        API — <span id="apiStatus">connecting…</span>
      </div>
      <div
        style="
          font-family: var(--mono);
          font-size: 0.65rem;
          color: var(--text-mute);
        "
      >
        Python FastAPI backend &amp; Vanilla JS frontend
      </div>
    </footer>

    <!-- ═══════════════════════════════════════════
     JavaScript — API Fetch & DOM update logic
     ═══════════════════════════════════════════ -->
    <script>
      /* ── Config ── */
      const API_BASE = "";
      let currency = "EGP";
      const currencyConfig = { EGP: { style: "currency", currency: "EGP", maximumFractionDigits: 2 }, USD: { style: "currency", currency: "USD", maximumFractionDigits: 2 } };

      /* ── Helpers ── */
      const fmt = (n) => new Intl.NumberFormat("en-US", currencyConfig[currency] || currencyConfig.EGP).format(Number(n) || 0);
      const now = () => new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      function el(id) { return document.getElementById(id); }
      function setHTML(id, h) { el(id).innerHTML = h; }
      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
      }
      async function apiRequest(path, options = {}) {
        const response = await fetch(API_BASE + path, { headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options });
        if (!response.ok) {
          let message = "Request failed (" + response.status + ")";
          try { const data = await response.json(); message = data.detail || message; } catch (_) {}
          throw new Error(message);
        }
        if (response.status === 204) return null;
        return response.json();
      }
      function showFeedback(id, message, isError = false) {
        const node = el(id); node.textContent = message; node.classList.toggle("error", isError);
      }
      function localDateString(date = new Date()) {
        return [date.getFullYear(), String(date.getMonth()+1).padStart(2,"0"), String(date.getDate()).padStart(2,"0")].join("-");
      }
      function applyCurrency(value) {
        currency = currencyConfig[value] ? value : "EGP";
        try { localStorage.setItem("smartbudget.currency", currency); } catch (_) {}
      }

            /* ── Skeleton placeholders while loading ── */
      function showSkeletons() {
        // Stats
        setHTML(
          "statsGrid",
          ["Income", "Expenses", "Saved", "Savings Rate"]
            .map(
              () => `
      <div class="stat-card">
        <div class="stat-label skeleton" style="width:70%;height:10px;margin-bottom:10px">&nbsp;</div>
        <div class="stat-value skeleton" style="width:80%;height:36px">&nbsp;</div>
        <div class="stat-bar"><div class="stat-bar-fill"></div></div>
      </div>`,
            )
            .join(""),
        );

        // Chart
        el("chartTitle").textContent = "Loading…";
        setHTML(
          "barChart",
          Array.from(
            { length: 12 },
            () =>
              `<div class="bar-wrap">
        <div class="bar skeleton" style="height:60px"></div>
        <div class="bar-label skeleton" style="width:20px;height:8px">&nbsp;</div>
      </div>`,
          ).join(""),
        );

        // Goals
        setHTML(
          "goalsGrid",
          Array.from(
            { length: 3 },
            () => `
      <div class="goal-card">
        <div class="goal-name skeleton" style="width:60%;height:10px">&nbsp;</div>
        <div class="goal-saved skeleton" style="width:50%;height:28px;margin:10px 0">&nbsp;</div>
        <div class="goal-bar"><div class="goal-fill"></div></div>
      </div>`,
          ).join(""),
        );
      }

      /* ── Render Stats ── */
      function renderStats(stats) {
        const income = Number(stats.income) || 0;
        const expenses = Number(stats.expenses) || 0;
        const saved = Number(stats.saved) || 0;
        const cards = [
          { label: "Income", value: fmt(income), badge: "↑ This month", cls: "up", fill: income > 0 ? 100 : 0 },
          { label: "Expenses", value: fmt(expenses), badge: "↓ " + fmt(expenses) + " spent", cls: "down", fill: income > 0 ? expenses / income * 100 : 0 },
          { label: "Saved", value: fmt(saved), badge: "Net savings", cls: "neu", fill: income > 0 ? saved / income * 100 : 0 },
          { label: "Savings Rate", value: (Number(stats.savings_rate) || 0) + "%", badge: "Of income", cls: "neu", fill: Number(stats.savings_rate) || 0 },
        ];
        setHTML("statsGrid", cards.map((c) => `
          <div class="stat-card">
            <div class="stat-label">${c.label}</div>
            <div class="stat-value">${c.value}</div>
            <span class="stat-badge ${c.cls}">${escapeHTML(c.badge)}</span>
            <div class="stat-bar"><div class="stat-bar-fill" data-fill="${Math.max(0, Math.min(Number(c.fill) || 0, 100))}"></div></div>
          </div>`).join(""));
        requestAnimationFrame(() => document.querySelectorAll(".stat-bar-fill").forEach((bar) => { bar.style.width = (bar.dataset.fill || 0) + "%"; }));
      }

      function renderChart(monthly) {
        const values = monthly.map((item) => Number(item.amount) || 0);
        const max = Math.max(1, ...values);
        el("chartTitle").textContent = "Monthly Expenses — Last 12 Months";
        const currentMonthIdx = monthly.length - 1;
        setHTML("barChart", monthly.map((m, i) => {
          const heightPct = Math.max(0, Math.round(((Number(m.amount) || 0) / max) * 100));
          const isHighlight = i === currentMonthIdx ? "highlight" : "";
          return `
            <div class="bar-wrap">
              <div class="bar ${isHighlight}" style="height:0" data-height="${heightPct}">
                <div class="bar-tooltip">${escapeHTML(m.month)}: ${fmt(m.amount)}</div>
              </div>
              <div class="bar-label">${escapeHTML(String(m.month || "").split(" ")[0])}</div>
            </div>`;
        }).join(""));
        requestAnimationFrame(() => document.querySelectorAll(".bar[data-height]").forEach((bar) => { bar.style.height = bar.dataset.height + "%"; }));
      }

      /* ── Render Saving Goals ── */
      function renderGoals(goals) {
        setHTML("goalsGrid", goals.length ? goals.map((g) => `
          <div class="goal-card">
            <div class="goal-name">${escapeHTML(g.name)}</div>
            <div class="goal-amounts"><div class="goal-saved">${fmt(g.saved)}</div><div class="goal-target">of ${fmt(g.target)}</div></div>
            <div class="goal-bar"><div class="goal-fill" data-fill="${Math.min(Number(g.percent)||0,100)}"></div></div>
            <div class="goal-pct">${Math.min(Number(g.percent)||0,100)}% complete</div>
            <div class="goal-actions"><button class="delete-btn" type="button" data-goal-progress="${Number(g.id)}" data-goal-saved="${Number(g.saved)}" data-goal-target="${Number(g.target)}">Update saved</button><button class="delete-btn" type="button" data-goal-delete="${Number(g.id)}">Delete goal</button></div>
          </div>`).join("") : '<div class="empty-state">No saving goals yet. Create one below.</div>');
        requestAnimationFrame(() => document.querySelectorAll(".goal-fill[data-fill]").forEach((f) => { f.style.width = f.dataset.fill + "%"; }));
      }

      function renderTransactions(transactions) {
        setHTML("transactionsList", transactions.length ? transactions.map((t) => `
          <div class="transaction-row">
            <div><strong>${escapeHTML(t.category)}</strong><div class="transaction-meta">${escapeHTML(t.occurred_on)}${t.note ? " · " + escapeHTML(t.note) : ""}</div></div>
            <div class="${t.kind === "income" ? "amount-income" : "amount-expense"}">${t.kind === "income" ? "+" : "−"}${fmt(t.amount)}</div>
            <button class="delete-btn" type="button" data-tx-delete="${Number(t.id)}" aria-label="Delete transaction">Delete</button>
          </div>`).join("") : '<div class="empty-state">No transactions yet. Add your first one above.</div>');
      }

            /* ── Main fetch ── */
      async function loadDashboard() {
        const btn = el("refreshBtn");
        btn.disabled = true; btn.textContent = "↻ Loading…";
        el("error-banner").style.display = "none";
        showSkeletons();
        try {
          const data = await apiRequest("/api/dashboard");
          renderStats(data.stats); renderChart(data.monthly_expenses || []);
          renderGoals(data.saving_goals || []); renderTransactions(data.recent_transactions || []);
          el("lastUpdated").textContent = "Last updated: " + now();
          el("apiStatus").textContent = "● connected"; el("apiStatus").style.color = "var(--green)";
        } catch (err) {
          console.error("API error:", err);
          el("error-banner").style.display = "block";
          el("lastUpdated").textContent = "Failed to load data";
          el("apiStatus").textContent = "● disconnected"; el("apiStatus").style.color = "var(--red)";
        } finally { btn.disabled = false; btn.textContent = "↻ Refresh"; el("loader").classList.add("hidden"); }
      }

            el("currencySelect").value = (() => { try { return localStorage.getItem("smartbudget.currency") || "EGP"; } catch (_) { return "EGP"; } })();
      applyCurrency(el("currencySelect").value);
      el("currencySelect").addEventListener("change", (event) => { applyCurrency(event.target.value); loadDashboard(); });
      el("txDate").value = localDateString();

      el("transactionForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget; // Capture before await; currentTarget is null after dispatch.
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true; showFeedback("txFeedback", "Saving transaction…");
        try {
          await apiRequest("/api/transactions", { method: "POST", body: JSON.stringify({
            kind: el("txKind").value, amount: Number(el("txAmount").value),
            category: el("txCategory").value.trim(), note: el("txNote").value.trim(), occurred_on: el("txDate").value
          })});
          form.reset(); el("txDate").value = localDateString();
          showFeedback("txFeedback", "Transaction saved."); await loadDashboard();
        } catch (error) { showFeedback("txFeedback", error.message, true); }
        finally { button.disabled = false; }
      });

      el("goalForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true; showFeedback("goalFeedback", "Saving goal…");
        try {
          await apiRequest("/api/saving-goals", { method: "POST", body: JSON.stringify({
            name: el("goalName").value.trim(), target: Number(el("goalTarget").value), saved: Number(el("goalSaved").value)
          })});
          form.reset(); el("goalSaved").value = "0";
          showFeedback("goalFeedback", "Saving goal created."); await loadDashboard();
        } catch (error) { showFeedback("goalFeedback", error.message, true); }
        finally { button.disabled = false; }
      });

      document.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const txButton = target.closest("[data-tx-delete]");
        const goalButton = target.closest("[data-goal-delete]");
        const progressButton = target.closest("[data-goal-progress]");
        try {
          if (txButton && confirm("Delete this transaction? This cannot be undone.")) {
            await apiRequest("/api/transactions/" + Number(txButton.dataset.txDelete), { method: "DELETE" });
            await loadDashboard();
          } else if (goalButton && confirm("Delete this saving goal? This cannot be undone.")) {
            await apiRequest("/api/saving-goals/" + Number(goalButton.dataset.goalDelete), { method: "DELETE" });
            await loadDashboard();
          } else if (progressButton) {
            const current = Number(progressButton.dataset.goalSaved), maximum = Number(progressButton.dataset.goalTarget);
            const entered = prompt("Enter total amount saved (maximum " + fmt(maximum) + "):", String(current));
            if (entered === null) return;
            const saved = Number(entered);
            if (!Number.isFinite(saved) || saved < 0 || saved > maximum) { alert("Enter a valid amount between 0 and " + maximum + "."); return; }
            await apiRequest("/api/saving-goals/" + Number(progressButton.dataset.goalProgress), { method: "PATCH", body: JSON.stringify({ saved }) });
            await loadDashboard();
          }
        } catch (error) { alert(error.message); }
      });

      loadDashboard();
    </script>
  </body>
</html>
